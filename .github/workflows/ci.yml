# ONLY the `production` branch deploys to the live site. `main` is the safe
# integration branch: it runs CI but never touches the server.
#
#   PR → main|production          → full verify only
#   Push to main                  → full verify only (NO deploy)
#   Push to production            → fast lint+typecheck → build both images in
#                                   parallel → smoke-test them → ship to the VPS
#                                   → migrate → bootstrap admin → health-gate
#   Manual run (workflow_dispatch)→ only deploys when run FROM `production`;
#                                   from main it just runs the checks.
#
# WHERE A CHANGE IS PROVED: on main. The heavy suite — migrations against a
# clean database, unit tests, the browser e2e — runs there. A release is
# `git push origin main:production`, the identical commit, so re-running all of
# that on production only re-proved the same SHA and added ~6 minutes to every
# deploy. production therefore runs lint+typecheck and ships.
#
# The trade, stated plainly: nothing mechanically stops an untested commit
# reaching production. Push production without pushing main, or push it while
# main is red, and it deploys anyway. Push main, see it green, then release.
#
# Every deploy job is gated on the production ref, so neither a PR nor a push to
# main can reach the server.
#
# SSH auth: the deploy key is stored base64-encoded (single line) in the
# VPS_SSH_KEY_B64 secret — a single line can't get its newlines mangled on
# paste. We decode it to a file and use plain ssh/scp.
name: CI & Deploy to Production

on:
  pull_request:
  push:
    branches: [main, production]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  # Cancel superseded PR runs, but NEVER a deploy: cancelling mid-SSH orphans
  # half-recreated containers on the VPS.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Deploy target dir on the VPS (owned by the VPS_USER deploy user).
  DEPLOY_DIR: /home/deploy/loadless

jobs:
  # ---------------------------------------------------------------
  # The full gate: lint, typecheck, migrations against a clean database, unit
  # tests and the browser e2e. Runs on PRs and on main — NOT on production.
  #
  # main is where a change is proved. A release is `git push origin
  # main:production` — the identical commit — so re-running this suite on
  # production only re-proved the same SHA and added ~6 minutes to every deploy.
  # production now runs a fast lint+typecheck and ships.
  #
  # The trade is deliberate and worth stating: nothing MECHANICALLY stops a
  # commit reaching production without this suite having passed. Pushing
  # production without pushing main first, or pushing it while main is red,
  # deploys untested code. Push main, see it green, then release.
  # ---------------------------------------------------------------
  verify:
    if: github.ref != 'refs/heads/production'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: loadless
          POSTGRES_PASSWORD: loadless
          POSTGRES_DB: loadless_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U loadless"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://loadless:loadless@localhost:5432/loadless_test?schema=public
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm -r lint

      - name: Build shared package
        run: pnpm --filter @loadless/shared build

      - name: Generate Prisma client
        run: pnpm --filter @loadless/api prisma:generate

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Validate migrations against a clean database
        run: pnpm --filter @loadless/api prisma:deploy

      - name: Unit tests
        run: pnpm -r test

      - name: Build apps
        run: pnpm --filter @loadless/api build && pnpm --filter @loadless/web build

      - name: Install Playwright browser
        run: pnpm --filter @loadless/web exec playwright install --with-deps chromium

      - name: E2E golden path (real API + DB + sockets)
        env:
          E2E_DATABASE_URL: postgresql://loadless:loadless@localhost:5432/loadless_test?schema=public
        run: |
          bash apps/web/e2e/prepare.sh
          pnpm --filter @loadless/web e2e



  # ---------------------------------------------------------------
  # Production's own quick sanity check. Cheap (~1-2 min, no services, no
  # browsers) and catches the one class of mistake that could differ between
  # main and this ref: a bad merge or a hand-edited file on the release branch.
  # ---------------------------------------------------------------
  typecheck:
    name: Typecheck & lint
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @loadless/shared build
      - run: pnpm --filter @loadless/api prisma:generate
      - run: pnpm -r lint
      - run: pnpm -r typecheck

  # ---------------------------------------------------------------
  # Build + push the api and web images IN PARALLEL — one matrix leg each, on
  # its own runner, so the slower (web / next build) doesn't wait behind the
  # api. Production branch only; needs verify green.
  # ---------------------------------------------------------------
  build:
    name: Build & push (${{ matrix.app }})
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/production'
    needs: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - app: api
            dockerfile: apps/api/Dockerfile
          - app: web
            dockerfile: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_SECRET }}

      # Tags: latest + commit SHA. The SHA tag is what the deploy pins to, so it
      # doubles as the rollback unit. Neither image takes a build arg: the web
      # image is domain-agnostic because the browser talks same-origin and Caddy
      # path-routes /api and /socket.io, so the SAME image serves any hostname.
      - name: Build & push ${{ matrix.app }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/loadless-${{ matrix.app }}:latest
            ${{ secrets.DOCKER_USERNAME }}/loadless-${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  # ---------------------------------------------------------------
  # Smoke-test the IMAGES THAT WILL SHIP, on the runner, before the VPS is
  # touched at all. verify proves the source is good; this proves the artefact
  # is: it pulls both images exactly as the VPS will (so a private-repo pull
  # failure or a missing tag surfaces here, not mid-deploy), brings up the REAL
  # docker-compose.prod.yml against throwaway data services, applies migrations,
  # runs the admin bootstrap against an empty database, and waits on the same
  # healthchecks the deploy gates on.
  #
  # Caddy is deliberately NOT started: it would request a real Let's Encrypt
  # certificate for the production hostname from a CI runner and burn rate limit.
  # ---------------------------------------------------------------
  smoke:
    name: Smoke test the built images
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/production'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_SECRET }}

      - name: Render a throwaway .env
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          # Disposable values — this stack lives for ~2 minutes on the runner and
          # is torn down with its volumes. Nothing here is a real secret.
          cat > .env <<EOF
          NODE_ENV='production'
          PORT='4100'
          DATABASE_URL='postgresql://loadless:smoke@postgres:5432/loadless?schema=public'
          REDIS_URL='redis://redis:6379'
          JWT_SECRET='smoke-test-jwt-secret-at-least-32-characters-long'
          APP_ORIGIN='https://smoke.invalid'
          SOCKET_REDIS_ADAPTER='false'
          STORAGE_DRIVER='local'
          LOCAL_STORAGE_DIR='/app/uploads'
          TRUSTED_PROXY_HOPS='1'
          POSTGRES_USER='loadless'
          POSTGRES_PASSWORD='smoke'
          POSTGRES_DB='loadless'
          FRONTEND_DOMAIN='smoke.invalid'
          ACME_EMAIL='smoke@invalid'
          DOCKER_USERNAME='$DOCKER_USERNAME'
          IMAGE_TAG='${{ github.sha }}'
          EOF

      - name: Pull the images the VPS will pull
        run: docker compose -f docker-compose.prod.yml pull api web

      - name: Migrate a fresh database
        run: |
          docker compose -f docker-compose.prod.yml up -d postgres redis
          for i in $(seq 1 20); do
            h="$(docker compose -f docker-compose.prod.yml ps --format '{{.Health}}' postgres 2>/dev/null || echo starting)"
            [ "$h" = "healthy" ] && break
            sleep 3
          done
          docker compose -f docker-compose.prod.yml run --rm -T api npx prisma migrate deploy </dev/null

      - name: Bootstrap an admin against the empty database
        run: |
          # Catches a broken bootstrap script before it is the only thing standing
          # between a rebuilt production database and nobody being able to log in.
          out=$(docker compose -f docker-compose.prod.yml run --rm -T \
            -e ADMIN_EMAIL='smoke@example.com' -e ADMIN_PASSWORD='smoke-password' \
            api node dist/scripts/bootstrap-admin.js </dev/null)
          echo "$out"
          echo "$out" | grep -q "Admin created" || { echo "::error::bootstrap-admin did not create an admin"; exit 1; }

      - name: Boot api + web and wait on their healthchecks
        run: |
          docker compose -f docker-compose.prod.yml up -d api web
          for i in $(seq 1 30); do
            api_h="$(docker compose -f docker-compose.prod.yml ps --format '{{.Health}}' api 2>/dev/null || echo starting)"
            web_h="$(docker compose -f docker-compose.prod.yml ps --format '{{.Health}}' web 2>/dev/null || echo starting)"
            echo "  ($i/30) api=$api_h web=$web_h"
            [ "$api_h" = "healthy" ] && [ "$web_h" = "healthy" ] && { echo "images are good"; exit 0; }
            sleep 5
          done
          echo "::error::the freshly built images never became healthy — NOT shipping"
          docker compose -f docker-compose.prod.yml logs --tail 80 api web
          exit 1

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.prod.yml down -v --remove-orphans || true

  # ---------------------------------------------------------------
  # Ship config, render .env, migrate, bootstrap, recreate the stack. Needs the
  # smoke job, so by the time anything reaches the VPS the exact images being
  # deployed have already booted and passed their healthchecks once. The
  # production guard is repeated deliberately (defence in depth): a skipped
  # `smoke` already skips this, but the condition makes the intent explicit.
  # ---------------------------------------------------------------
  deploy:
    name: Ship & Deploy
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/production'
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Fail fast with the list of missing names rather than a confusing error
      # halfway through the deploy.
      #
      # Each secret is mapped in BY NAME. The shorter alternative — serialising
      # the whole secrets context into one variable — is indistinguishable from a
      # secret-exfiltration step, and GitHub's workflow scanner refused to run the
      # file at all because of it ("this workflow file may be malicious",
      # 2026-09-01). Enumerating is also simply tighter: this step then holds only
      # the eleven values it actually checks, not every secret in the repository.
      - name: Validate required secrets
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_SECRET: ${{ secrets.DOCKER_SECRET }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY_B64: ${{ secrets.VPS_SSH_KEY_B64 }}
          FRONTEND_DOMAIN: ${{ secrets.FRONTEND_DOMAIN }}
          ACME_EMAIL: ${{ secrets.ACME_EMAIL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          SEED_ADMIN_EMAIL: ${{ secrets.SEED_ADMIN_EMAIL }}
          SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
        run: |
          missing=""
          for name in DOCKER_USERNAME DOCKER_SECRET VPS_HOST VPS_USER VPS_SSH_KEY_B64 \
                      FRONTEND_DOMAIN ACME_EMAIL JWT_SECRET POSTGRES_PASSWORD \
                      SEED_ADMIN_EMAIL SEED_ADMIN_PASSWORD; do
            [ -z "$(eval echo \"\$$name\")" ] && missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing required GitHub secret(s):$missing"
            exit 1
          fi
          echo "All required secrets present."

      - uses: actions/checkout@v4

      - name: Prepare SSH key
        env:
          KEY_B64: ${{ secrets.VPS_SSH_KEY_B64 }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s' "$KEY_B64" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          head -1 ~/.ssh/deploy_key | grep -q "BEGIN OPENSSH PRIVATE KEY" \
            || { echo "::error::VPS_SSH_KEY_B64 did not decode to a valid private key"; exit 1; }
          echo "✓ SSH key decoded"

      # Hostinger runs always-on edge DDoS scrubbing in front of the VPS: GitHub's
      # shared runner IPs intermittently get flagged and their SYNs are dropped
      # before reaching the host (→ timeout, invisible to ufw/sshd — no failed
      # login line). It is IP-based, not port-based. The window is short, so poll
      # rather than fail; a sustained block exits non-zero and a re-run draws a
      # fresh runner IP.
      - name: Wait for VPS SSH to be reachable
        env:
          HOST: ${{ secrets.VPS_HOST }}
          PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          for i in $(seq 1 7); do
            if timeout 8 bash -c "exec 3<>/dev/tcp/$HOST/$PORT" 2>/dev/null; then
              echo "✓ $HOST:$PORT reachable (attempt $i/7)"; exit 0
            fi
            echo "… $HOST:$PORT unreachable (attempt $i/7) — likely Hostinger edge scrub; retrying in 8s"
            sleep 8
          done
          echo "::error::$HOST:$PORT never became reachable (~1 min) — sustained edge scrub. Re-run for a fresh runner IP."
          exit 1

      - name: Render production .env
        env:
          FRONTEND_DOMAIN: ${{ secrets.FRONTEND_DOMAIN }}
          ACME_EMAIL: ${{ secrets.ACME_EMAIL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          # Single-quote every value — compose's env parser expands $ in
          # unquoted values and chokes on < / spaces. Compose is NOT a shell:
          # there is no escape for a single quote inside single quotes, so a
          # value containing one fails LOUDLY here instead of corrupting.
          put() {
            case "$2" in *"'"*) echo "::error::Value of $1 contains a single quote — regenerate it without one"; exit 1;; esac
            printf "%s='%s'\n" "$1" "$2"
          }
          # POSTGRES_PASSWORD is interpolated RAW into DATABASE_URL below. A '/'
          # terminates the URL's authority section and '@' ':' '?' '#' split it,
          # so such a password produces a VALID-LOOKING url pointing somewhere
          # else — Prisma then fails with a confusing host/database error rather
          # than "bad password". `openssl rand -base64` emits '/' and '+' often,
          # so this is a live trap on every rotation. Reject it loudly here.
          case "$POSTGRES_PASSWORD" in
            *[/@:?\#]*)
              echo "::error::POSTGRES_PASSWORD contains a URL-unsafe character (one of / @ : ? #). Regenerate with: openssl rand -hex 32"
              exit 1;;
          esac
          {
            put NODE_ENV production
            put PORT 4100
            put DATABASE_URL "postgresql://loadless:${POSTGRES_PASSWORD}@postgres:5432/loadless?schema=public"
            put REDIS_URL "redis://redis:6379"
            put JWT_SECRET "$JWT_SECRET"
            put APP_ORIGIN "https://${FRONTEND_DOMAIN}"
            put SOCKET_REDIS_ADAPTER false
            # Uploads live on the VPS disk (CLAUDE.md product decision): the R2
            # adapter exists but stays unused until volume demands it. This path
            # is the `uploads_data` named volume mounted in docker-compose.prod.yml
            # — without that mount every driver photo dies on the next redeploy.
            put STORAGE_DRIVER local
            put LOCAL_STORAGE_DIR /app/uploads
            # Caddy is directly internet-facing: exactly one proxy hop. A wrong
            # value silently breaks rate limiting, IP allowlists and audit logs.
            put TRUSTED_PROXY_HOPS 1
            put POSTGRES_USER loadless
            put POSTGRES_PASSWORD "$POSTGRES_PASSWORD"
            put POSTGRES_DB loadless
            put FRONTEND_DOMAIN "$FRONTEND_DOMAIN"
            put ACME_EMAIL "$ACME_EMAIL"
            put DOCKER_USERNAME "$DOCKER_USERNAME"
            # Pin to THIS commit's immutable tag, not floating :latest. Two
            # payoffs: `up -d` always sees a changed image ref so api/web are
            # reliably recreated, and the tag IS the version, so rollback is
            # just redeploying the previous SHA.
            put IMAGE_TAG "${{ github.sha }}"
          } > prod.env
          chmod 600 prod.env

      - name: Ship files to the VPS
        env:
          HOST: ${{ secrets.VPS_HOST }}
          SSH_USER: ${{ secrets.VPS_USER }}
          PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          set -e
          KEY=~/.ssh/deploy_key
          COMMON="-o StrictHostKeyChecking=accept-new"
          ssh -i "$KEY" -p "$PORT" $COMMON "$SSH_USER@$HOST" "mkdir -p '$DEPLOY_DIR'"
          scp -i "$KEY" -P "$PORT" $COMMON \
            docker-compose.prod.yml Caddyfile "$SSH_USER@$HOST:$DEPLOY_DIR/"
          scp -i "$KEY" -P "$PORT" $COMMON \
            prod.env "$SSH_USER@$HOST:$DEPLOY_DIR/.env"
          ssh -i "$KEY" -p "$PORT" $COMMON "$SSH_USER@$HOST" "chmod 600 '$DEPLOY_DIR/.env'"

      - name: Deploy on the VPS (login, pull, migrate, bootstrap, up, health gate)
        env:
          HOST: ${{ secrets.VPS_HOST }}
          SSH_USER: ${{ secrets.VPS_USER }}
          PORT: ${{ secrets.VPS_PORT || '22' }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_SECRET: ${{ secrets.DOCKER_SECRET }}
          SEED_ADMIN_EMAIL: ${{ secrets.SEED_ADMIN_EMAIL }}
          SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEY=~/.ssh/deploy_key
          COMMON="-o StrictHostKeyChecking=accept-new"
          # The remote script is captured into a variable so the secrets can be
          # prepended over STDIN instead of riding the ssh argv — argv is
          # world-readable via `ps` on the VPS for the whole deploy. The admin
          # credentials go the same way, and deliberately NOT into the rendered
          # .env: they are needed for one one-off container, so there is no
          # reason for the long-running api process to hold them in its env.
          REMOTE_SCRIPT="$(cat <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_DIR"

          # The images may be private (a fresh Docker Hub repo inherits the
          # account default), and the deploy user's ~/.docker/config.json starts
          # empty — so an anonymous `pull` would fail with an auth error that
          # reads like the tag doesn't exist. Log in every time; it is cheap.
          echo "$DOCKER_SECRET" | docker login -u "$DOCKER_USERNAME" --password-stdin

          # Tag currently running (empty on the first deploy). If the new release
          # proves healthy this becomes the rollback target.
          PREV_TAG="$(cat .deploy_current 2>/dev/null || true)"
          NEW_TAG="$(grep -E '^IMAGE_TAG=' .env | cut -d= -f2 | tr -d "'")"

          echo "==> Pulling images"
          docker compose -f docker-compose.prod.yml pull

          # Data services first, so the migration has a database to talk to.
          echo "==> Starting postgres + redis"
          docker compose -f docker-compose.prod.yml up -d postgres redis
          for i in $(seq 1 20); do
            h="$(docker compose -f docker-compose.prod.yml ps --format '{{.Health}}' postgres 2>/dev/null || echo starting)"
            [ "$h" = "healthy" ] && break
            sleep 3
          done

          # `-T` AND `</dev/null` are both load-bearing. This whole script is
          # piped into `bash -s`, so the remote bash reads it from stdin;
          # `compose run` attaches and DRAINS stdin, swallowing the rest of this
          # script — `up -d` and everything below would never run and the deploy
          # would go green with the old containers still serving.
          # prisma is a PROD dependency of @loadless/api, so this resolves inside
          # the image with no network fetch.
          echo "==> Applying migrations"
          docker compose -f docker-compose.prod.yml run --rm -T api npx prisma migrate deploy </dev/null

          # First-admin bootstrap. NOT a seeded fixture (playbook §9: never seed
          # dev/e2e fixtures in production) — a dedicated script reading
          # credentials from env, idempotent: if any ADMIN exists it prints
          # "nothing to do". Safe on every deploy, and it means a rebuilt
          # database is never left with nobody able to log in. It only ever
          # creates the FIRST admin; rotating a password is done in the app.
          echo "==> Ensuring the first admin exists"
          docker compose -f docker-compose.prod.yml run --rm -T \
            -e ADMIN_EMAIL="$SEED_ADMIN_EMAIL" -e ADMIN_PASSWORD="$SEED_ADMIN_PASSWORD" \
            api node dist/scripts/bootstrap-admin.js </dev/null

          # Caddy is not recreated by `up -d` (its compose definition is
          # unchanged), so a freshly-shipped Caddyfile would not load on its own.
          # Reload it now, while the current api/web are still serving. Reload is
          # graceful and atomic: an invalid Caddyfile is rejected and the running
          # config kept, so this can never break the live proxy. `</dev/null` for
          # the same stdin-draining reason as above.
          if docker compose -f docker-compose.prod.yml ps --status running caddy 2>/dev/null | grep -q caddy; then
            echo "==> Reloading Caddy config"
            docker compose -f docker-compose.prod.yml exec -T caddy \
              caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile </dev/null \
              || echo "::warning::caddy reload failed — Caddy kept its previous config; verify the Caddyfile"
          fi

          # IMAGE_TAG is pinned to this commit's SHA, so only api/web (whose image
          # ref changed) get recreated. postgres/redis/caddy keep running
          # untouched — data volumes are never recreated, so nothing is lost.
          echo "==> Starting the stack"
          docker compose -f docker-compose.prod.yml up -d --remove-orphans

          echo "==> Health gate"
          for i in $(seq 1 30); do
            api_h="$(docker compose -f docker-compose.prod.yml ps --format '{{.Health}}' api 2>/dev/null || echo starting)"
            web_h="$(docker compose -f docker-compose.prod.yml ps --format '{{.Health}}' web 2>/dev/null || echo starting)"
            echo "  ($i/30) api=$api_h web=$web_h"
            if [ "$api_h" = "healthy" ] && [ "$web_h" = "healthy" ]; then
              echo "==> Healthy"

              # Record the rollback pointer, then drop images we no longer need.
              # Keep the new release, the previous one, and :latest; remove the
              # rest so the disk doesn't grow unbounded (these images are ~1-3 GB
              # each — the retired project accumulated 16 GB in five weeks).
              echo "$NEW_TAG" > .deploy_current
              if [ -n "$PREV_TAG" ] && [ "$PREV_TAG" != "$NEW_TAG" ]; then
                echo "$PREV_TAG" > .deploy_previous
              fi
              KEEP=" $NEW_TAG $PREV_TAG latest "
              for repo in "$DOCKER_USERNAME/loadless-api" "$DOCKER_USERNAME/loadless-web"; do
                docker images "$repo" --format '{{.Tag}}' | sort -u | while read -r t; do
                  case "$KEEP" in
                    *" $t "*) : ;;
                    *) docker rmi "$repo:$t" >/dev/null 2>&1 || true ;;
                  esac
                done
              done
              docker image prune -f >/dev/null 2>&1 || true

              docker compose -f docker-compose.prod.yml ps
              echo "DEPLOY OK"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Health gate FAILED — the previous images are still on the box."
          docker compose -f docker-compose.prod.yml logs --tail 80 api web >&2
          echo "Roll back with: IMAGE_TAG=\$(cat $DEPLOY_DIR/.deploy_previous) then 'up -d'." >&2
          exit 1
          REMOTE
          )"
          { printf 'DOCKER_SECRET=%q\n' "$DOCKER_SECRET"
            printf 'SEED_ADMIN_EMAIL=%q\n' "$SEED_ADMIN_EMAIL"
            printf 'SEED_ADMIN_PASSWORD=%q\n' "$SEED_ADMIN_PASSWORD"
            printf '%s\n' "$REMOTE_SCRIPT"; } | \
            ssh -i "$KEY" -p "$PORT" $COMMON "$SSH_USER@$HOST" \
              "DEPLOY_DIR='$DEPLOY_DIR' DOCKER_USERNAME='$DOCKER_USERNAME' bash -s"
